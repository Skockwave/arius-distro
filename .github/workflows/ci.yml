# Runs the ARIUS test suite and a syntax/undefined-name lint on every push and
# pull request that touches arius-ai/. The project itself needs only the
# standard library, so the install step is just pytest (the "dev" extra).
name: CI

on:
  push:
    paths:
      - "arius-ai/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "arius-ai/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: arius-ai

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # ARIUS is installed on Windows by default (bootstrap.ps1 / install.bat),
          # so run the suite there too. Deliberately without PYTHONUTF8 (which the
          # .bat launchers set) so an I/O call that forgets encoding= is caught.
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests -q

  lint:
    # ruff's default rule set (pyflakes + the pycodestyle error subset); the
    # version range comes from the "dev" extra in pyproject.toml.
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check --output-format github .
