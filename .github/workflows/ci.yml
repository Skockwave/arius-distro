# Runs the ARIUS test suite and a syntax/undefined-name lint on every push and
# pull request that touches arius-ai/. The project itself needs only the
# standard library, so the install step is just pytest (the "dev" extra).
name: CI

on:
  push:
    paths:
      - "arius-ai/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "arius-ai/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: arius-ai

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests -q

  lint:
    # Only rules that flag real breakage (syntax errors, undefined names,
    # invalid literals/comparisons) so this stays green without a style
    # cleanup; tighten the --select list once the codebase is ruff-clean.
    name: ruff (syntax & undefined names)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint
        run: ruff check --select E9,F63,F7,F82 --output-format github .
